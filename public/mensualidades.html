<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensualidades - CREARTE</title>
    <link rel="stylesheet" href="/css/clases.css">
</head>

<body class="admin-body">

<header class="navbar-admin">
    <div class="logo-container-admin">
        <img src="/assets/logo crearte azul.svg" alt="CREARTE" class="logo-admin">
    </div>

    <a href="#" class="btn-logout" onclick="cerrarSesion()">
        Cerrar sesión ➔
    </a>
</header>

<div class="layout-container">

    <aside class="sidebar-admin">
        <nav class="sidebar-nav">
            <a href="/admin.html" class="sidebar-link">Panel</a>
            <a href="/clases.html" class="sidebar-link">Cursos</a>
            <a href="/alumnos.html" class="sidebar-link">Alumnos</a>
            <a href="/profesores.html" class="sidebar-link">Profesores</a>
            <a href="/horarios.html" class="sidebar-link">Horarios</a>
            <a href="/salones.html" class="sidebar-link">Salones</a>
            <a href="/mensualidades.html" class="sidebar-link active">Mensualidades</a>
            <a href="/pagos.html" class="sidebar-link">Pagos</a>
            <a href="/inscripciones.html" class="sidebar-link">Inscripciones</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="content-header">
            <h1>Gestión de Mensualidades</h1>
            <p>Administra mensualidades y adeudos de alumnos.</p>
        </header>

        <section class="form-section">
            <div class="form-card">

                <form id="formMensualidad" class="clase-form">

                    <input type="hidden" id="id_mensualidad_edicion">

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Folio recibo</label>
                            <input type="text" id="folio_recibo" placeholder="Ej. REC-001" required>
                        </div>

                        <div class="form-group">
                            <label>Concepto</label>
                            <input type="text" id="concepto" placeholder="Ej. Mensualidad mayo" required>
                        </div>

                        <div class="form-group">
                            <label>Monto</label>
                            <input type="number" id="monto" placeholder="1200" required>
                        </div>

                        <div class="form-group">
                            <label>Fecha límite</label>
                            <input type="date" id="fecha_limite" required>
                        </div>

                        <div class="form-group">
                            <label>Estado</label>
                            <select id="estado" required>
                                <option value="Pendiente">Pendiente</option>
                                <option value="Pagada">Pagada</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Mes</label>
                            <input type="number" id="mes" placeholder="5" required>
                        </div>

                        <div class="form-group">
                            <label>Año</label>
                            <input type="number" id="anio" placeholder="2026" required>
                        </div>

                        <div class="form-group">
                            <label>Alumno</label>
                            <select id="id_alumno" required>
                                <option value="">Selecciona un alumno</option>
                            </select>
                        </div>

                    </div>

                    <div class="form-buttons">
                        <button type="submit" id="btnGuardar" class="btn-primary">
                            Guardar Mensualidad
                        </button>

                        <button type="button" id="btnCancelar" class="btn-cancel" style="display: none;">
                            Cancelar
                        </button>
                    </div>

                </form>

            </div>
        </section>

        <section class="table-section">

            <h3 class="table-title">Mensualidades registradas</h3>

            <div class="table-card">

                <table class="custom-table">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Folio</th>
                            <th>Concepto</th>
                            <th>Monto</th>
                            <th>Fecha límite</th>
                            <th>Estado</th>
                            <th>Mes</th>
                            <th>Año</th>
                            <th>Alumno</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaMensualidades"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="/js/mensualidades.js"></script>

</body>

</html>
