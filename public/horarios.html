<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreARTE - Administración de Horarios</title>

    <link rel="stylesheet" href="/css/clases.css">
</head>

<body class="admin-body">

<header class="navbar-admin">
    <div class="logo-container-admin">
        <img src="/assets/logo crearte azul.svg" alt="CreARTE" class="logo-admin">
    </div>

    <a href="#" class="btn-logout" onclick="cerrarSesion()">
        Cerrar sesión ➔
    </a>
</header>

<div class="layout-container">

    <aside class="sidebar-admin">
        <nav class="sidebar-nav">
            <a href="/admin.html" class="sidebar-link">Panel</a>
            <a href="/clases.html" class="sidebar-link">Cursos</a>
            <a href="/clases_programadas.html"class="sidebar-link" >Clases Programadas</a>
            <a href="/alumnos.html" class="sidebar-link">Alumnos</a>
            <a href="/profesores.html" class="sidebar-link">Profesores</a>
            <a href="/horarios.html" class="sidebar-link active">Horarios</a>
            <a href="/salones.html" class="sidebar-link">Salones</a>
                       <a
                    href="/mensualidades.html"
                    class="sidebar-link"
                >
                    Mensualidades
                </a>

                <a
                    href="/pagos.html"
                    class="sidebar-link"
                >
                    Pagos
                </a>

                <a
                    href="/inscripciones.html"
                    class="sidebar-link"
                >
                    Inscripciones
                </a>

        </nav>
    </aside>

    <main class="main-content">

        <header class="content-header">
            <h1>Administración de Horarios</h1>
            <p>Gestiona los días y horas disponibles para las clases.</p>
        </header>

        <section class="form-section">
            <div class="form-card">

                <form id="horarioForm" class="clase-form">

                    <input type="hidden" id="id_horario_edicion">

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="dia">Día</label>
                            <select id="dia" required>
                                <option value="">Selecciona un día</option>
                                <option value="Lunes">Lunes</option>
                                <option value="Martes">Martes</option>
                                <option value="Miércoles">Miércoles</option>
                                <option value="Jueves">Jueves</option>
                                <option value="Viernes">Viernes</option>
                                <option value="Sábado">Sábado</option>
                                <option value="Domingo">Domingo</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="hora_inicio">Hora de inicio</label>
                            <input type="time" id="hora_inicio" required>
                        </div>

                        <div class="form-group">
                            <label for="hora_fin">Hora de fin</label>
                            <input type="time" id="hora_fin" required>
                        </div>

                    </div>

                    <div class="form-buttons">

                        <button type="submit" id="btnGuardar" class="btn-primary">
                            Guardar Horario
                        </button>

                        <button type="button" id="btnCancelar" class="btn-cancel" style="display: none;">
                            Cancelar Edición
                        </button>

                    </div>

                </form>

            </div>
        </section>

        <section class="table-section">

            <h3 class="table-title">Listado de Horarios</h3>

            <div class="table-card">

                <table class="custom-table">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Día</th>
                            <th>Hora inicio</th>
                            <th>Hora fin</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaHorarios"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="/js/horarios.js"></script>

</body>
</html>
