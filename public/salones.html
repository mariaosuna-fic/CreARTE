<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Salones - CREARTE
    </title>

    <link
        rel="stylesheet"
        href="/css/clases.css"
    >

</head>

<body class="admin-body">

<script>

    const token = localStorage.getItem('token');
    const rol = localStorage.getItem('rol');

    if (!token || rol !== 'admin') {

        alert('Debes iniciar sesión como administrador');

        window.location.href = '/login.html';

    }

</script>

<!-- NAVBAR -->

<header class="navbar-admin">

    <div class="logo-container-admin">

        <img
            src="/assets/logo crearte azul.svg"
            alt="CREARTE"
            class="logo-admin"
        >

    </div>

    <a
        href="#"
        class="btn-logout"
        onclick="cerrarSesion()"
    >
        Cerrar sesión ➔
    </a>

</header>

<!-- LAYOUT -->

<div class="layout-container">

    <!-- SIDEBAR -->

    <aside class="sidebar-admin">

        <nav class="sidebar-nav">

            <a href="/admin.html" class="sidebar-link">
                Panel
            </a>

            <a href="/clases.html" class="sidebar-link">
                Cursos
            </a>

            <a href="/clases_programadas.html"class="sidebar-link" >Clases Programadas</a>

            <a href="/alumnos.html" class="sidebar-link">
                Alumnos
            </a>

            <a href="/profesores.html" class="sidebar-link">
                Profesores
            </a>

            <a href="/horarios.html" class="sidebar-link">
                Horarios
            </a>

            <a
                href="/salones.html"
                class="sidebar-link active"
            >
                Salones
            </a>
            
            <a
                    href="/mensualidades.html"
                    class="sidebar-link"
                >
                    Mensualidades
                </a>

                <a
                    href="/pagos.html"
                    class="sidebar-link"
                >
                    Pagos
                </a>

                <a
                    href="/inscripciones.html"
                    class="sidebar-link"
                >
                    Inscripciones
                </a>


        </nav>

    </aside>

    <!-- MAIN -->

    <main class="main-content">

        <!-- HEADER -->

        <header class="content-header">

            <h1>
                Gestión de Salones
            </h1>

            <p>
                Administra los salones registrados
                en CREARTE.
            </p>

        </header>

        <!-- FORMULARIO -->

        <section class="form-section">

            <div class="form-card">

                <form id="formSalon" class="clase-form">

                    <div class="form-grid">

                        <div class="form-group">

                            <label>
                                Nombre del salón
                            </label>

                            <input
                                type="text"
                                id="nombre_salon"
                                placeholder="Ej. Salón de danza"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>
                                Capacidad
                            </label>

                            <input
                                type="number"
                                id="capacidad"
                                min="1"
                                placeholder="20"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-buttons">

                        <button
                            type="submit"
                            id="btnGuardar"
                            class="btn-primary"
                        >

                            Guardar Salón

                        </button>

                    </div>

                </form>

            </div>

        </section>

        <!-- TABLA -->

        <section class="table-section">

            <h3 class="table-title">
                Salones registrados
            </h3>

            <div class="table-card">

                <table class="custom-table">

                    <thead>

                        <tr>

                            <th>ID Salón</th>

                            <th>Nombre</th>

                            <th>Capacidad</th>

                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tablaSalones">

                        <!-- JS -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script>

    function cerrarSesion() {

        localStorage.clear();

        alert('Sesión cerrada correctamente');

        window.location.href = '/login.html';

    }

</script>

<script src="/js/salones.js"></script>

</body>

</html>
