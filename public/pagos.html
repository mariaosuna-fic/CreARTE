<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pagos - CREARTE</title>

    <link
        rel="stylesheet"
        href="/css/clases.css"
    >

</head>

<body class="admin-body">

    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <header class="navbar-admin">

        <div class="logo-container-admin">

            <img
                src="/assets/logo crearte azul.svg"
                alt="CREARTE"
                class="logo-admin"
            >

        </div>

        <a
            href="#"
            class="btn-logout"
            onclick="cerrarSesion()"
        >
            Cerrar sesión ➔
        </a>

    </header>


    <div class="layout-container">

        <!-- ========================= -->
        <!-- SIDEBAR -->
        <!-- ========================= -->

        <aside class="sidebar-admin">

            <nav class="sidebar-nav">

                <a
                    href="/admin.html"
                    class="sidebar-link"
                >
                    Panel
                </a>

                <a
                    href="/clases.html"
                    class="sidebar-link"
                >
                    Cursos
                </a>

                <a
                    href="/alumnos.html"
                    class="sidebar-link"
                >
                    Alumnos
                </a>

                <a
                    href="/profesores.html"
                    class="sidebar-link"
                >
                    Profesores
                </a>

                <a
                    href="/horarios.html"
                    class="sidebar-link"
                >
                    Horarios
                </a>

                <a
                    href="/salones.html"
                    class="sidebar-link"
                >
                    Salones
                </a>

                <a
                    href="/mensualidades.html"
                    class="sidebar-link"
                >
                    Mensualidades
                </a>

                <a
                    href="/pagos.html"
                    class="sidebar-link active"
                >
                    Pagos
                </a>

                <a
                    href="/inscripciones.html"
                    class="sidebar-link"
                >
                    Inscripciones
                </a>

            </nav>

        </aside>


        <!-- ========================= -->
        <!-- CONTENIDO -->
        <!-- ========================= -->

        <main class="main-content">

            <header class="content-header">

                <h1>
                    Gestión de Pagos
                </h1>

                <p>
                    Administra los pagos realizados por los alumnos.
                </p>

            </header>


            <!-- ========================= -->
            <!-- FORMULARIO -->
            <!-- ========================= -->

            <section class="form-section">

                <div class="form-card">

                    <form
                        id="formPago"
                        class="clase-form"
                    >

                        <input
                            type="hidden"
                            id="id_pago_edicion"
                        >

                        <div class="form-grid">

                            <!-- FECHA -->

                            <div class="form-group">

                                <label>
                                    Fecha de pago
                                </label>

                                <input
                                    type="date"
                                    id="fecha_pago"
                                    required
                                >

                            </div>


                            <!-- MENSUALIDAD -->

                            <div class="form-group">

                                <label>
                                    Mensualidad
                                </label>

                                <select
                                    id="id_mensualidad"
                                    required
                                >

                                    <option value="">
                                        Selecciona una mensualidad
                                    </option>

                                </select>

                            </div>


                            <!-- CONCEPTO -->

                            <div class="form-group">

                                <label>
                                    Concepto
                                </label>

                                <input
                                    type="text"
                                    id="concepto"
                                    placeholder="Se llenará automáticamente"
                                    readonly
                                >

                            </div>


                            <!-- MONTO -->

                            <div class="form-group">

                                <label>
                                    Monto de mensualidad
                                </label>

                                <input
                                    type="number"
                                    id="monto"
                                    placeholder="Se llenará automáticamente"
                                    readonly
                                >

                            </div>


                            <!-- MONTO PAGADO -->

                            <div class="form-group">

                                <label>
                                    Monto pagado
                                </label>

                                <input
                                    type="number"
                                    id="monto_pagado"
                                    placeholder="800"
                                    required
                                >

                            </div>


                            <!-- MÉTODO -->

                            <div class="form-group">

                                <label>
                                    Método de pago
                                </label>

                                <select
                                    id="metodo_pago"
                                    required
                                >

                                    <option value="">
                                        Selecciona método
                                    </option>

                                    <option value="Efectivo">
                                        Efectivo
                                    </option>

                                    <option value="Transferencia">
                                        Transferencia
                                    </option>

                                    <option value="Tarjeta">
                                        Tarjeta
                                    </option>

                                </select>

                            </div>

                        </div>


                        <!-- BOTONES -->

                        <div class="form-buttons">

                            <button
                                type="submit"
                                id="btnGuardar"
                                class="btn-primary"
                            >
                                Guardar Pago
                            </button>

                            <button
                                type="button"
                                id="btnCancelar"
                                class="btn-cancel"
                                style="display: none;"
                            >
                                Cancelar
                            </button>

                        </div>

                    </form>

                </div>

            </section>


            <!-- ========================= -->
            <!-- TABLA -->
            <!-- ========================= -->

            <section class="table-section">

                <h3 class="table-title">
                    Pagos registrados
                </h3>

                <div class="table-card">

                    <table class="custom-table">

                        <thead>

                            <tr>

                                <th>ID Pago</th>

                                <th>Fecha</th>

                                <th>Alumno</th>

                                <th>Concepto</th>

                                <th>Monto pagado</th>

                                <th>Método</th>

                                <th>Estado</th>

                                <th>Acciones</th>

                            </tr>

                        </thead>

                        <tbody id="tablaPagos"></tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script src="/js/pagos.js"></script>

</body>

</html>
