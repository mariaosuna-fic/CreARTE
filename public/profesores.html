<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesores - CREARTE</title>
    <link rel="stylesheet" href="/css/clases.css">
</head>

<body class="admin-body">

<header class="navbar-admin">
    <div class="logo-container-admin">
        <img src="/assets/logo crearte azul.svg" alt="CREARTE" class="logo-admin">
    </div>

    <a href="#" class="btn-logout" onclick="cerrarSesion()">
        Cerrar sesión ➔
    </a>
</header>

<div class="layout-container">

    <aside class="sidebar-admin">
        <nav class="sidebar-nav">
            <a href="/admin.html" class="sidebar-link">Panel</a>
            <a href="/clases.html" class="sidebar-link">Cursos</a>
            <a href="/clases-programadas.html"class="sidebar-link" >Clases Programadas</a>
            <a href="/alumnos.html" class="sidebar-link">Alumnos</a>
            <a href="/profesores.html" class="sidebar-link active">Profesores</a>
            <a href="/horarios.html" class="sidebar-link">Horarios</a>
            <a href="/salones.html" class="sidebar-link">Salones</a>
                           <a
                    href="/mensualidades.html"
                    class="sidebar-link"
                >
                    Mensualidades
                </a>

                <a
                    href="/pagos.html"
                    class="sidebar-link"
                >
                    Pagos
                </a>

                <a
                    href="/inscripciones.html"
                    class="sidebar-link"
                >
                    Inscripciones
                </a>

        </nav>
    </aside>

    <main class="main-content">

        <header class="content-header">
            <h1>Gestión de Profesores</h1>
            <p>Administra los profesores registrados en CREARTE.</p>
        </header>

        <section class="form-section">
            <div class="form-card">

                <form id="formProfesor" class="clase-form">

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Nombre completo</label>
                            <input type="text" id="nombre" placeholder="Ej. Carlos López" required>
                        </div>

                        <div class="form-group">
                            <label>Correo electrónico</label>
                            <input type="email" id="correo" placeholder="Ej. profesor@gmail.com" required>
                        </div>

                        <div class="form-group">
                            <label>Contraseña temporal</label>
                            <input type="password" id="contraseña" placeholder="Solo para nuevo profesor">
                        </div>

                        <div class="form-group">
                            <label>Especialidad</label>
                            <input type="text" id="especialidad" placeholder="Ej. Danza" required>
                        </div>

                        <div class="form-group">
                            <label>Disponibilidad</label>
                            <input type="text" id="disponibilidad" placeholder="Ej. Lunes a viernes" required>
                        </div>

                    </div>

                    <div class="form-buttons">
                        <button type="submit" id="btnGuardar" class="btn-primary">
                            Guardar Profesor
                        </button>

                        <button type="button" id="btnCancelar" class="btn-cancel" style="display: none;">
                            Cancelar Edición
                        </button>
                    </div>

                </form>

            </div>
        </section>

        <section class="table-section">

            <h3 class="table-title">Profesores registrados</h3>

            <div class="table-card">

                <table class="custom-table">

                    <thead>
                        <tr>
                            <th>ID Profesor</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Especialidad</th>
                            <th>Disponibilidad</th>
                            <th>ID Usuario</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tablaProfesores"></tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="/js/profesores.js"></script>

</body>

</html>
