<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Alumnos - CREARTE
    </title>

    <link
        rel="stylesheet"
        href="/css/clases.css"
    >

</head>

<body class="admin-body">

<script>

    const token = localStorage.getItem('token');
    const rol = localStorage.getItem('rol');

    if (!token || rol !== 'admin') {

        alert('Debes iniciar sesión como administrador');

        window.location.href = '/login.html';

    }

</script>

<!-- NAVBAR -->

<header class="navbar-admin">

    <div class="logo-container-admin">

        <img
            src="/assets/logo crearte azul.svg"
            alt="CREARTE"
            class="logo-admin"
        >

    </div>

    <a
        href="#"
        class="btn-logout"
        onclick="cerrarSesion()"
    >
        Cerrar sesión ➔
    </a>

</header>

<!-- LAYOUT -->

<div class="layout-container">

    <!-- SIDEBAR -->

    <aside class="sidebar-admin">

        <nav class="sidebar-nav">
            <a href="/admin.html" class="sidebar-link">Panel</a>
            <a href="/clases.html" class="sidebar-link">Clases</a>
            <a href="/clases_programadas.html" class="sidebar-link active">Clases Programadas</a>
            <a href="/alumnos.html" class="sidebar-link">Alumnos</a>
            <a href="/profesores.html" class="sidebar-link">Profesores</a>
            <a href="/horarios.html" class="sidebar-link">Horarios</a>
            <a href="/salones.html" class="sidebar-link">Salones</a>
            <a href="/mensualidades.html" class="sidebar-link">Mensualidades</a>
            <a href="/pagos.html" class="sidebar-link">Pagos</a>
            <a href="/inscripciones.html" class="sidebar-link">Inscripciones</a>
        </nav>

    </aside>

    <!-- MAIN -->

    <main class="main-content">

        <!-- HEADER -->

        <header class="content-header">

            <h1>
                Gestión de Alumnos
            </h1>

            <p>
                Administra los alumnos registrados
                en CREARTE.
            </p>

        </header>

        <!-- FORMULARIO -->

        <section class="form-section">

            <div class="form-card">

                <form id="formAlumno" class="clase-form">

                    <div class="form-grid">

                        <div class="form-group">

                            <label>
                                Nombre completo
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                placeholder="Ej. Ana López"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                id="correo"
                                placeholder="Ej. ana@gmail.com"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>
                                Contraseña temporal
                            </label>

                            <input
                                type="password"
                                id="contraseña"
                                placeholder="Ej. ana123"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>
                                Matrícula
                            </label>

                            <input
                                type="text"
                                id="matricula"
                                placeholder="Ej. A001"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>
                                Teléfono
                            </label>

                            <input
                                type="text"
                                id="telefono"
                                placeholder="Ej. 6671234567"
                                required
                            >

                        </div>

                        <div class="form-group">

                            <label>
                                Fecha de registro
                            </label>

                            <input
                                type="date"
                                id="fecha_registro"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-buttons">

                        <button
                            type="submit"
                            id="btnGuardar"
                            class="btn-primary"
                        >

                            Guardar Alumno

                        </button>

                    </div>

                </form>

            </div>

        </section>

        <!-- TABLA -->

        <section class="table-section">

            <h3 class="table-title">
                Alumnos registrados
            </h3>

            <div class="table-card">

                <table class="custom-table">

                    <thead>

                        <tr>

                            <th>ID Alumno</th>

                            <th>Nombre</th>

                            <th>Correo</th>

                            <th>Matrícula</th>

                            <th>Teléfono</th>

                            <th>Fecha Registro</th>

                            <th>ID Usuario</th>

                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tablaAlumnos">

                        <!-- JS -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script>

    function cerrarSesion() {

        localStorage.clear();

        alert('Sesión cerrada correctamente');

        window.location.href = '/login.html';

    }

</script>

<script src="/js/alumnos.js"></script>

</body>

</html>
